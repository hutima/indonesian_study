name: Recent focus vocabulary CI

on:
  push:
    branches:
      - feature/recent-focus-vocab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate
