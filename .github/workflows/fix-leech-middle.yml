name: Fix leech middle-deck semantics

on:
  push:
    branches:
      - fix/leech-middle-deck-lapses

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[srs-fix-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/leech-middle-deck-lapses
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write regression tests first
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/progress.test.mjs')
          text = p.read_text()
          old = """test('four hard lapses invoke Duff relaxed leech drill', () => {
            let state = { version: 1, items: {} };
            for (let n = 0; n < 4; n++) state = recordVocabReview(state, 'id-u02-voc-baca', 'again', true, 1_700_000_000_000 + n * 86400000);
            assert.equal(getVocabProgressEntry(state, 'id-u02-voc-baca', 'i2e').leechDrill, true);
            assert.equal(getVocabProgressEntry(state, 'id-u02-voc-baca', 'i2e').intervalDays, 1);
          });
          """
          new = """test('fresh-card Again retries stay in learning and never count as leech lapses', () => {
            const id = 'id-u02-voc-baca';
            const start = 1_700_000_000_000;
            let state = { version: 1, items: {} };
            for (let n = 0; n < 6; n++) {
              const now = start + n * 1000;
              state = recordVocabReview(state, id, 'again', true, now);
              const item = getVocabProgressEntry(state, id, 'i2e');
              assert.equal(item.dueAt, now + 300000);
              assert.equal(item.leechDrill, false);
            }
            const item = getVocabProgressEntry(state, id, 'i2e');
            assert.equal(item.lapseCount || 0, 0);
            assert.equal(item.srsStage || 0, 0);
          });

          test('repeated Again during one established-card relearn episode counts one lapse', () => {
            const id = 'id-u02-voc-baca';
            const start = 1_700_000_000_000;
            let state = { version: 1, items: {} };
            for (let n = 0; n < 5; n++) state = recordVocabReview(state, id, 'know', true, start + n * 86400000);
            const before = getVocabProgressEntry(state, id, 'i2e');
            const stageBefore = before.srsStage;
            state = recordVocabReview(state, id, 'again', true, start + 6 * 86400000);
            const first = getVocabProgressEntry(state, id, 'i2e');
            assert.equal(first.lapseCount, 1);
            assert.equal(first.srsStage, stageBefore - 1);
            const easeAfterFirst = first.ease;
            for (let n = 1; n <= 4; n++) {
              state = recordVocabReview(state, id, 'again', true, start + 6 * 86400000 + n * 1000);
            }
            const repeated = getVocabProgressEntry(state, id, 'i2e');
            assert.equal(repeated.lapseCount, 1);
            assert.equal(repeated.srsStage, stageBefore - 1);
            assert.ok(Math.abs(repeated.ease - easeAfterFirst) < 1e-9);
            assert.equal(repeated.leechDrill, false);
          });

          test('fourth genuine established-card lapse flags leech but stays on the short Again timer', () => {
            const id = 'id-u02-voc-baca';
            const now = 1_800_000_000_000;
            const state = {
              version: 1,
              items: {},
              vocabDirections: {
                i2e: {
                  [id]: {
                    correct: 5, wrong: 3, again: 3, unsure: 0, know: 5,
                    first: now - 20 * 86400000, last: now - 86400000,
                    streak: 5, easyStreak: 5, srsStage: 4, ease: 2.3,
                    intervalDays: 14, lastEasyIntervalDays: 14,
                    lapseCount: 3, inRelearn: false, relearnLeft: 0,
                    preLapseIntervalDays: 14, leechDrill: false, leechStreak: 2,
                    confidenceHistory: [1, 1, 1, 1, 1]
                  }
                },
                e2i: {}
              }
            };
            let next = recordVocabReview(state, id, 'again', true, now);
            let item = getVocabProgressEntry(next, id, 'i2e');
            assert.equal(item.lapseCount, 4);
            assert.equal(item.leechDrill, true);
            assert.equal(item.leechStreak, 0);
            assert.equal(item.dueAt, now + 300000);
            next = recordVocabReview(next, id, 'again', true, now + 1000);
            item = getVocabProgressEntry(next, id, 'i2e');
            assert.equal(item.lapseCount, 4);
            assert.equal(item.dueAt, now + 1000 + 300000);
          });
          """
          if old not in text:
            raise SystemExit('expected old leech regression test block')
          p.write_text(text.replace(old, new))

          p = Path('tests/vocab-deck.test.mjs')
          text = p.read_text()
          addition = """

          test('a card entering leech drill still goes through middle and repeats when active empties', () => {
            const now = 1_800_000_000_000;
            const id = 'one';
            const progress = {
              version: 1,
              items: {},
              vocabDirections: {
                i2e: {
                  [id]: {
                    correct: 5, wrong: 3, again: 3, unsure: 0, know: 5,
                    first: now - 20 * 86400000, last: now - 86400000,
                    streak: 5, easyStreak: 5, srsStage: 4, ease: 2.3,
                    intervalDays: 14, lastEasyIntervalDays: 14,
                    lapseCount: 3, inRelearn: false, relearnLeft: 0,
                    preLapseIntervalDays: 14, leechDrill: false, leechStreak: 2,
                    confidenceHistory: [1, 1, 1, 1, 1]
                  }
                },
                e2i: {}
              }
            };
            const deck = { active: ['one', 'two'], middle: [], completed: 0, total: 2 };
            const hard = reviewVocab(deck, progress, 'again', true, now);
            assert.equal(getVocabProgressEntry(hard.progress, id, 'i2e').leechDrill, true);
            assert.deepEqual(hard.deck.active, ['two']);
            assert.deepEqual(hard.deck.middle, ['one']);
            const clearedOther = reviewVocab(hard.deck, hard.progress, 'know', true, now + 1000);
            assert.deepEqual(clearedOther.deck.active, ['one']);
            assert.deepEqual(clearedOther.deck.middle, []);
          });
          """
          p.write_text(text + addition)
          PY

      - name: Confirm regression tests fail before the fix
        run: |
          set +e
          node --test tests/progress.test.mjs tests/vocab-deck.test.mjs > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected regression tests to fail before production changes.' >&2
            exit 1
          fi

      - name: Apply canonical lapse/leech semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('progress.js')
          text = p.read_text()
          old = """  if (rating === 'again') {
            item.streak = 0; item.easyStreak = 0;
            item.srsStage = Math.max(0, getSrsStage(item) - 1);
            item.ease = clamp(getSrsEase(item) - .2, 1.3, 3);
            item.lapseCount = count(item.lapseCount) + 1;
            if (item.leechDrill || item.lapseCount >= LEECH_LAPSE_THRESHOLD) {
              item.leechDrill = true; item.leechStreak = 0;
              item.inRelearn = false; item.relearnLeft = 0;
              item.lastEasyIntervalDays = LEECH_DRILL_DAYS;
              schedule(item, LEECH_DRILL_DAYS, now);
            } else {
              if (!item.inRelearn) item.preLapseIntervalDays = Math.max(days(item.lastEasyIntervalDays), days(item.intervalDays));
              item.inRelearn = true; item.relearnLeft = SRS_HARD_RELEARN_STEPS;
              item.intervalDays = 0; item.dueAt = now + SRS_AGAIN_MS;
            }
          } else if (item.leechDrill) {
          """
          new = """  if (rating === 'again') {
            const wasInRelearn = item.inRelearn === true;
            const wasLeech = item.leechDrill === true;
            const establishedDays = Math.max(days(item.lastEasyIntervalDays), days(item.intervalDays));
            // A lapse is a new failure episode of previously established spacing.
            // Fresh-card retries and repeated Again marks within one relearn
            // episode only recycle through middle; they do not repeatedly lower
            // ease/stage or inflate the lifetime lapse counter.
            const startsLapseEpisode = !wasInRelearn && !wasLeech && establishedDays > 0;
            item.streak = 0; item.easyStreak = 0;
            if (startsLapseEpisode) {
              item.srsStage = Math.max(0, getSrsStage(item) - 1);
              item.ease = clamp(getSrsEase(item) - .2, 1.3, 3);
              item.lapseCount = count(item.lapseCount) + 1;
              item.preLapseIntervalDays = establishedDays;
            }
            const shouldLeech = wasLeech || (startsLapseEpisode && item.lapseCount >= LEECH_LAPSE_THRESHOLD);
            if (shouldLeech) {
              item.leechDrill = true; item.leechStreak = 0;
              item.inRelearn = false; item.relearnLeft = 0;
              // Leech controls the schedule AFTER a clean answer. A failed
              // attempt still gets the normal short Again timer and stays in
              // the live middle-deck loop for this sitting.
              item.intervalDays = 0; item.dueAt = now + SRS_AGAIN_MS;
            } else {
              if (!wasInRelearn) item.preLapseIntervalDays = establishedDays;
              item.inRelearn = true; item.relearnLeft = SRS_HARD_RELEARN_STEPS;
              item.intervalDays = 0; item.dueAt = now + SRS_AGAIN_MS;
            }
          } else if (item.leechDrill) {
          """
          if old not in text:
            raise SystemExit('expected current Again scheduling block')
          p.write_text(text.replace(old, new))

          p = Path('vocab-deck.js')
          text = p.read_text()
          old = """  const nextProgress = rating === 'next' ? progress : recordVocabReview(progress, deck.active[0], rating, spaced, now, direction);
            const leech = spaced && rating === 'again' && getVocabProgressEntry(nextProgress, deck.active[0], direction)?.leechDrill;
            return { deck: markDeck(deck, leech ? 'unsure' : rating, spaced), progress: nextProgress };
          """
          new = """  const nextProgress = rating === 'next' ? progress : recordVocabReview(progress, deck.active[0], rating, spaced, now, direction);
            return { deck: markDeck(deck, rating, spaced), progress: nextProgress };
          """
          if old not in text:
            raise SystemExit('expected leech deck-suppression block')
          text = text.replace(old, new)
          text = text.replace("import { dueVocab, recordVocabReview, getVocabProgressEntry } from './progress.js';", "import { dueVocab, recordVocabReview } from './progress.js';")
          p.write_text(text)

          p = Path('sw.js')
          text = p.read_text()
          if "indonesian-study-v23" not in text:
            raise SystemExit('expected Indonesian cache v23')
          p.write_text(text.replace('indonesian-study-v23', 'indonesian-study-v24'))
          PY

      - name: Run full verification
        run: |
          npm test
          npm run validate
          node --check progress.js
          node --check vocab-deck.js
          git diff --check

      - name: Commit and push verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add progress.js vocab-deck.js tests/progress.test.mjs tests/vocab-deck.test.mjs sw.js
          git commit -m '[srs-fix-generated] Align leech lapses with middle-deck relearning'
          git push origin HEAD:fix/leech-middle-deck-lapses
